  </head>
  <body>
    <script>
      // Stamped before first paint so a reload never flashes the wrong theme.
      try {
        var stored = localStorage.getItem("musictools.theme.v1");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        כלי המוזיקה מעבדים את השיר בתוך הדפדפן, ולכן דרוש JavaScript פעיל.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
