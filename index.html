  <body>
    <script>
      // Stamped before first paint so a reload never flashes the wrong theme.
      try {
        var stored = localStorage.getItem("musictools.theme.v1");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <div id="root"></div>
