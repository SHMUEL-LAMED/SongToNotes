name: Deploy SongToNotes GPU

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gpu/**"
      - ".github/workflows/deploy-gpu.yml"

permissions:
  contents: read

concurrency:
  group: songtonotes-gpu
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Modal
        run: python -m pip install "modal==1.5.5"
      - name: Verify credentials exist
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
      - name: Deploy GPU endpoint
        run: python -m modal deploy gpu/modal_app.py
