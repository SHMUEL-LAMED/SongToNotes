name: Deploy Supabase functions

# The site goes out through GitHub Pages; the Edge Functions do not, so this
# sends them to Supabase whenever one of them changes on main, or on demand.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a personal access token
# from supabase.com/dashboard/account/tokens).

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
    inputs:
      function:
        description: "One function to deploy (empty: all of them)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

env:
  PROJECT_REF: ydcfafijktzasrkkxyux

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check the token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      # The site calls the functions with the publishable key, which is not a
      # JWT, and each function checks the signed-in user itself — so the
      # gateway's own JWT check stays off, as the functions run today.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ONLY: ${{ github.event.inputs.function }}
        run: |
          if [ -n "$ONLY" ]; then
            supabase functions deploy "$ONLY" --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          else
            failed=""
            for dir in supabase/functions/*/; do
              name="$(basename "$dir")"
              case "$name" in _*) continue ;; esac
              echo "::group::$name"
              supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api --no-verify-jwt || failed="$failed $name"
              echo "::endgroup::"
            done
            if [ -n "$failed" ]; then
              echo "::error::Failed to deploy:$failed"
              exit 1
            fi
          fi
