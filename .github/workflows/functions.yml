name: Deploy Supabase functions

# GitHub Pages deploys the site; this workflow deploys the Edge Functions.
# It runs only from main and can also be started manually from main.
# Requires SUPABASE_ACCESS_TOKEN in repository Actions secrets.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions.yml"
  workflow_dispatch:
    inputs:
      function:
        description: "One function to deploy (empty: all of them)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: true

env:
  PROJECT_REF: ydcfafijktzasrkkxyux

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse manual deploy outside main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Manual Supabase deployments are allowed only from main."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # These functions already run with the gateway JWT check disabled and
      # perform their own checks where needed, so preserve the current setting.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ONLY: ${{ github.event.inputs.function }}
        run: |
          if [ -n "$ONLY" ]; then
            if [ ! -d "supabase/functions/$ONLY" ] || [ "${ONLY#_}" != "$ONLY" ]; then
              echo "::error::Unknown or internal function: $ONLY"
              exit 1
            fi

            supabase functions deploy "$ONLY" \
              --project-ref "$PROJECT_REF" \
              --use-api \
              --no-verify-jwt
          else
            # Deploy every local function. No --prune: the project also hosts
            # functions that live outside this repository (ivr-announcer), and
            # pruning stops to ask about deleting them, which fails the job in
            # CI — and answering yes would take a live function down.
            supabase functions deploy \
              --project-ref "$PROJECT_REF" \
              --use-api \
              --no-verify-jwt
          fi
